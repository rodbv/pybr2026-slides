# Builds the decks and previews and attaches them to a GitHub Release for every version tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Ubuntu's own LibreOffice leaves empty image placeholders out of the PDF previews,
      # so the release uses the current version from the LibreOffice PPA.
      - name: Install LibreOffice, poppler and ImageMagick
        run: |
          sudo add-apt-repository -y ppa:libreoffice/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils imagemagick
          soffice --version

      # LibreOffice lays out and embeds the fonts installed on the machine.
      - name: Install the template fonts
        run: |
          mkdir -p ~/.local/share/fonts
          find fonts -name '*.ttf' -exec cp {} ~/.local/share/fonts/ \;
          fc-cache -f

      - run: npm ci
      - run: npm run all

      # The README links to the fixed names under releases/latest; the versioned copies keep
      # the version in the file name, which Google Slides and Drive show as the title.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ext in pptx odp; do
            cp "dist/pybr2026-template.$ext" "dist/pybr2026-template-$GITHUB_REF_NAME.$ext"
          done
          (cd marp && zip -qr ../dist/pybr2026-marp.zip .)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "dist/pybr2026-template-$GITHUB_REF_NAME.pptx" \
            "dist/pybr2026-template-$GITHUB_REF_NAME.odp" \
            dist/pybr2026-template.pptx \
            dist/pybr2026-template.odp \
            dist/pybr2026-marp.zip \
            dist/preview/tour.gif \
            dist/preview/overview.png
